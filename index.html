<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#4b1125"><meta name="description" content="Uma declaração de SanSan para Raissa, com muito amor.">
<title>Eu amo você, Raissa ♡</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--cream:#fff2e4;--rose:#e7a8b7}*{box-sizing:border-box}body{margin:0;background:#4b1125;color:var(--cream);font-family:'DM Sans',sans-serif}body:before{content:'';position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 75% 35%,#95455255,transparent 55%),radial-gradient(ellipse at 10% 85%,#270c1e99,transparent 55%)}main{position:relative;min-height:100svh;display:flex;flex-direction:column;align-items:center;padding:30px 24px 22px;overflow:hidden}.top{width:100%;max-width:1100px;display:flex;justify-content:space-between;align-items:center;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#e9b9c4}.top span:last-child{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:18px;letter-spacing:0}.hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;text-align:center;padding:52px 0 35px}.eyebrow{font-size:10px;letter-spacing:4px;text-transform:uppercase;color:var(--rose);margin:0 0 24px}.heart{width:62px;height:65px;margin-bottom:20px;filter:drop-shadow(0 4px 18px #e89aaa40);animation:beat 4s ease-in-out infinite}.heart path{fill:none;stroke:#e7a8b7;stroke-width:1.2}h1{font-family:'Cormorant Garamond',Georgia,serif;font-size:clamp(64px,11vw,142px);line-height:.85;font-weight:400;letter-spacing:-3px;margin:0}h1 span{display:block}h1 .love{font-style:italic;color:#e7a8b7;margin:10px 0 16px}.subtitle{max-width:290px;font-family:'Cormorant Garamond',Georgia,serif;font-size:22px;line-height:1.45;color:#efcbd0;margin:28px 0}button:focus-visible{outline:2px solid #fff2e4;outline-offset:5px}.footer{width:100%;max-width:1100px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid #e7a8b726;padding-top:18px;font-size:10px;letter-spacing:1px;color:#d59eac}.ornament{position:absolute;width:340px;height:480px;border:1px solid #e7a8b71f;border-radius:50%;transform:rotate(-30deg);left:-260px;top:25%;pointer-events:none}.ornament.right{left:auto;right:-270px;top:15%;transform:rotate(30deg)}h1 .name{display:block;font-size:.65em;letter-spacing:2px;color:var(--rose);margin-top:28px;font-style:italic}.heart-button{width:76px;height:76px;padding:12px;border:1px solid #e7a8b755;border-radius:50%;background:#e7a8b70a;color:var(--rose);cursor:pointer;touch-action:manipulation;transition:transform .2s,background .2s;position:relative;z-index:2;flex-shrink:0}.heart-button:hover{background:#e7a8b719}.heart-button:active{transform:scale(.9)}.heart-button svg{display:block;width:100%;height:100%;filter:drop-shadow(0 3px 12px #e7a8b750)}.heart-button path{fill:currentColor}.heart-hint{font-size:11px;letter-spacing:.4px;color:#e9b9c4;margin:14px 0 0}.footer{justify-content:center;text-align:center;font-family:'Cormorant Garamond',Georgia,serif;font-size:18px;line-height:1.5;letter-spacing:0}.floating-heart{position:fixed;width:36px;height:36px;z-index:10;pointer-events:none;color:#f6b8cc;filter:drop-shadow(0 0 10px #f6b8cc66);animation:rise 2.6s ease-out forwards}.floating-heart svg{width:100%;height:100%;fill:currentColor}@keyframes rise{0%{opacity:1;transform:translate(-50%,-50%) scale(.65)}15%{opacity:1;transform:translate(-50%,-70%) scale(1)}100%{opacity:0;transform:translate(calc(-50% + var(--drift)),var(--rise)) scale(1.3)}}@keyframes fade-heart{0%,65%{opacity:1}100%{opacity:0}}@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}@keyframes float{from{opacity:.9;transform:translateY(0) rotate(0)}to{opacity:0;transform:translateY(-170px) rotate(25deg)}}@media(min-width:700px){h1 span{display:inline}h1 .love{margin:0 16px}.hero{padding:60px 0}.subtitle{max-width:400px}.heart{margin-bottom:36px}main{padding:35px 50px 24px}.eyebrow{margin-bottom:36px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.floating-heart{animation:fade-heart 1.5s ease-out forwards!important;transform:translate(-50%,-50%)}}
</style>
</head>
<body>
<main>
<header class="top"><span>Uma carta de amor</span><span>para você, sempre.</span></header>
<div class="ornament" aria-hidden="true"></div><div class="ornament right" aria-hidden="true"></div>
<section class="hero" aria-labelledby="declaration">
<p class="eyebrow">Entre todas as palavras...</p>
<svg class="heart" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 54S5 38 5 21C5 4 27 4 32 19C37 4 59 4 59 21C59 38 32 54 32 54Z"/></svg>
<h1 id="declaration"><span>EU</span> <span class="love">AMO</span> <span>VOCÊ</span> <span class="name">RAISSA</span></h1>
<p class="subtitle">Três palavras. Um mundo inteiro<br>de sentimento.</p>
<button class="heart-button" id="send-heart" aria-label="Soltar um coração para Raissa"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 54S5 38 5 21C5 4 27 4 32 19C37 4 59 4 59 21C59 38 32 54 32 54Z"/></svg></button>
<p class="heart-hint">Toque no coração e veja o amor subir ♡</p>
</section>

<footer class="footer">feito por SanSan com muito amor para a Minha Princesa</footer>
</main>
<script>
const button = document.querySelector('#send-heart');
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
button.addEventListener('click', () => {
  const bounds = button.getBoundingClientRect();
  const heart = document.createElement('span');
  heart.className = 'floating-heart';
  heart.setAttribute('aria-hidden', 'true');
  heart.innerHTML = '<svg viewBox="0 0 64 64"><path d="M32 54S5 38 5 21C5 4 27 4 32 19C37 4 59 4 59 21C59 38 32 54 32 54Z"/></svg>';
  heart.style.left = (bounds.left + bounds.width / 2) + 'px';
  heart.style.top = (bounds.top + bounds.height / 2) + 'px';
  heart.style.setProperty('--drift', (Math.random() * 100 - 50) + 'px');
  heart.style.setProperty('--rise', -(bounds.top + bounds.height / 2 + 60) + 'px');
  document.body.append(heart);
  heart.addEventListener('animationend', () => heart.remove(), { once: true });
  setTimeout(() => heart.remove(), reducedMotion.matches ? 1800 : 3000);
});
</script>
</body></html>
